<!DOCTYPE html>
<html>
    <head>
        <title>
            sign up
        </title>
    </head>
    <body style="font-family: 'Times New Roman', Times, serif;">
        <h1>
            Sign up
        </h1>
        
        <form>
            <table>
               
                <tr>
                    <td>
                        First Name :
                    </td>
                    <td>
                        <input type="text"> 
                    </td>
                </tr>
                <tr>
                    <td>
                        Last Name :
                    </td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>
                        Date of Birth :
                    </td>
                    <td>
                        <input type="date">
                    </td>
                </tr>
                <tr>
                    <td>
                        Gender :
                    </td>
                    <td>
                        <input type="radio" name="gender" value="Male">Male
                        <input type="radio" name="gender" value="Female">Female
                        <input type="radio" name="gender" value="Others">Others
                    </td>
                </tr>
                <tr>
                    <td>
                        Address :
                    </td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>
                        interest :
                    </td>
                    <td>
                        <input type="checkbox" name="int" value="data science">data science
                        <input type="checkbox" name="int" value="AI">AI
                        <input type="checkbox" name="int" value="Software engineering">Software engineering
                    </td>
                </tr>
                <tr>
                    <td>
                        New Password
                    </td>
                    <td>
                        <input type="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit">
                    </td>
                    <td>
                        <input type="reset">
                    </td>
                </tr>
                
            </table>

        </form>
    </body>
</html>

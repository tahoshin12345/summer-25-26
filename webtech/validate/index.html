<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="registrationForm">
        
        <label for="name">name: </label><br>
        <input type="text" id="name"><br>
        <div id="nameErr"></div><br><br>

        <label for="age">age:</label><br>
        <input type="text" id="age"><br>
        <div id="ageErr"></div><br><br>

        <label for="id">id:</label><br>
        <input type="text" id="id"><br>
        <div id="idErr"></div><br><br>

        <label for="email">email:</label><br>
        <input type="text" id="email"><br>
        <div id="emailErr"></div><br><br>
        
        <label for="phone">phone:</label><br>
        <input type="text" id="phone"><br>
        <div id="phoneErr"></div><br><br>

        <label for="message">message:</label><br>
        <textarea id="message" name="message" rows="6" cols="50" placeholder="Type your long text here..."></textarea><br>
        <div id="messageErr"></div><br><br>

        <input type="submit" value="Submit">
        
    </form> <script src="script.js"></script>
</body>
</html>
